services:
  postgres:
    image: postgres:16
    container_name: teamarr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teamarr
      POSTGRES_USER: teamarr
      POSTGRES_PASSWORD: teamarr
      TZ: America/Halifax
    volumes:
      - teamarr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamarr -d teamarr"]
      interval: 10s
      timeout: 5s
      retries: 10

  teamarr:
    build: .
    container_name: teamarr-dev-psql
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 9195:9195
    volumes:
      - /mnt/e/Dispatch/teamarr/data:/app/data
    environment:
      TZ: America/Halifax
      DATABASE_URL: postgresql://teamarr:teamarr@postgres:5432/teamarr

volumes:
  teamarr_postgres_data:
